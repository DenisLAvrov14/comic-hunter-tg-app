# Токены в адресах не должны попадать в логи.
map $request_uri $safe_uri {
  default $request_uri;
  ~^/cal/ /cal/***;
  ~^/join/ /join/***;
  ~^/api/v1/events/by-link/ /api/v1/events/by-link/***;
}

# За Caddy (prod) схема приходит в X-Forwarded-Proto; в dev nginx — первый прокси.
map $http_x_forwarded_proto $fwd_proto {
  default $http_x_forwarded_proto;
  '' $scheme;
}

log_format safe '$remote_addr [$time_local] "$request_method $safe_uri" $status '
                '$body_bytes_sent "$http_user_agent" "$http_x_forwarded_for"';

server {
  listen 80;
  root /usr/share/nginx/html;
  access_log /var/log/nginx/access.log safe;

  # Внутренний вход бота — только из сети контейнеров.
  location /api/v1/internal/ {
    return 404;
  }

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
  }

  # Фото из MinIO (бакет standup, префикс photos/ открыт на чтение).
  location /media/ {
    proxy_pass http://minio:9000/standup/;
    proxy_set_header Host minio:9000;
  }

  # Публичная ICS-подписка на календарь и страница подключения.
  location /cal/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
  }

  location /health {
    proxy_pass http://api:3000;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
